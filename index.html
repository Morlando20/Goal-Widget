<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream Goal Widget</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="goal-widget">
    <div class="background"></div>
    <div class="content">
      <div class="goal-name" id="goal-name">MOVIE NIGHT</div>
      <div
        class="progress-bar"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="progress-fill" id="progress-fill"></div>
        <div class="character" id="character"></div>
      </div>
      <div class="progress-text" id="progress-text">0/100</div>
      <div class="goal-complete-message" id="complete-message">GOAL REACHED! THANK YOU</div>
    </div>
    <div class="celebration" id="celebration">
      <!-- Placeholder for celebration animation -->
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
